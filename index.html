<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control: enrollment queue prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;color-scheme:light;
--bg:#FFFFFF;--side:#F7F7F6;--sunk:#F2F1EF;--ink:#1D1B18;--muted:#5F5A52;--faint:#8A847A;--line:#E7E5E1;
--accent:#D2560B;--accent-hover:#B8490A;--accent-soft:#FFF3EA;--red:#B42318;--red-soft:#FDEEEC;--blue:#1D4FB8;--blue-soft:#EEF3FC;
--green:#1C6E43;--green-soft:#E7F4EC;--warn-bg:#FFF5D6;--warn-ink:#6F4B00}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
#app{height:100%;padding-top:env(safe-area-inset-top,0px)}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.logo{padding:4px 8px 18px}.logo b{font-weight:700}.logo span{color:var(--faint);font-size:12px;margin-left:10px}
.nav{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:7px;text-align:left;font-size:14px}
.nav span{color:var(--faint);font-size:12px}
.nav:hover{background:#EEEDEA}.nav.on{background:#E9E8E4;font-weight:500}
.navh{color:var(--faint);font-size:13px;padding:22px 8px 6px}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.pagebar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);flex:none}
.pagebar h1{font-size:20px;font-weight:600}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.grow{flex:1}
.body{flex:1;min-height:0;overflow:auto}
.small{font-size:12.5px;color:var(--muted)}
.ml{display:inline-flex;flex-wrap:wrap;gap:0 10px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.reason{font-size:12.5px;font-weight:500}
.late{color:var(--red)}.soon{color:var(--blue)}.ok{color:var(--muted)}.good{color:var(--green)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);font-weight:500}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.good{background:var(--green-soft);color:var(--green)}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.oncall{background:var(--green);border-color:var(--green);color:#fff}
kbd{font-family:"Geist Mono",ui-monospace,monospace;font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-left:6px;border:1px solid var(--line)}
.btn.primary kbd{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:12.5px}
/* tasks layout */
.tasks{display:grid;grid-template-columns:370px minmax(0,1fr) 280px;height:100%}
.qcol{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.qtop{flex:none}
.qalert{padding:12px 16px;border-bottom:1px solid var(--line)}
.qalert.urgent{background:var(--red-soft)}.qalert.urgent strong{color:var(--red)}
.qalert.info{background:var(--blue-soft)}.qalert.info strong{color:var(--blue)}
.qalert.offer{background:var(--accent-soft)}
.qalert-row{display:flex;align-items:center;gap:10px}
.qalert-row strong{flex:1;font-weight:600;font-size:13.5px}
.qalert .small{margin-top:2px}
.cd{font-family:"Geist Mono",ui-monospace,monospace;font-size:14px;font-variant-numeric:tabular-nums;color:var(--red)}
.qbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.qscroll{flex:1;overflow:auto;min-height:0}
.ghead{display:flex;justify-content:space-between;background:var(--side);padding:7px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.qitem{display:flex;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:12px 16px;border-left:3px solid transparent}
.qitem:hover{background:#FAFAF9}
.qitem.active{background:var(--accent-soft);border-left-color:var(--accent)}
.qitem.mine{background:var(--green-soft);border-left-color:var(--green)}
.qn{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;color:var(--muted);background:var(--bg)}
.qitem.active .qn{background:var(--accent);border-color:var(--accent);color:#fff}
.qbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.qtitle{font-weight:500}
.qbody .tag{align-self:flex-start;margin-top:3px}
.qempty{padding:32px 20px;color:var(--muted);text-align:center}
.hint{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hint kbd{margin:0 3px 0 0}
.center{overflow:auto;min-height:0}
.crumbs{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 28px;border-bottom:1px solid var(--line);min-height:48px}
.crumbs .ml span+span::before{content:"›";margin-right:10px;color:var(--faint)}
.crumbs .ml{gap:0 10px}
.detail{max-width:760px;margin:0 auto;padding:28px 32px 120px}
.detail h1{font-size:24px;font-weight:600}
.lead{color:var(--muted);margin:6px 0 10px;max-width:68ch}
.sh{font-size:15px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;color:var(--muted);font-weight:400}
.box{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pad{padding:12px 16px}
.plain{margin:0 0 6px;padding-left:18px}
.callcard{display:flex;border:1px solid #F3C9A8;border-radius:10px;overflow:hidden;background:#FFFBF7}
.date{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #F3C9A8;background:var(--accent-soft);font-size:11px;color:var(--muted);letter-spacing:.04em}
.date b{font-size:26px;color:var(--ink);letter-spacing:0;line-height:1.2}
.callbody{flex:1;padding:14px 18px;min-width:0}
.callhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.callbody dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
.callbody dt{color:var(--muted);font-size:13px}.callbody dd{margin:0}
details.box summary{cursor:pointer;font-weight:600;padding:12px 16px;list-style:none;display:flex;justify-content:space-between}
details.box{margin-top:26px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"Show";color:var(--muted);font-weight:400;font-size:13px}
details[open] summary::after{content:"Hide"}
details ol{margin:0;padding:0 16px 4px 36px}details ol li{margin-bottom:8px;max-width:64ch}
.tl{display:flex;flex-direction:column;gap:10px}
.tlnote{border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.tlrow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:0 4px}
.capture>div{padding:14px 16px}.capture>div+div{border-top:1px solid var(--line)}
.lbl{font-weight:500;margin-bottom:4px;display:block}
.req{color:var(--red);font-size:12px;font-weight:500;margin-left:8px}.req.met{color:var(--green)}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px}
input{width:100%;padding:9px 12px;margin-top:8px}
textarea{width:100%;min-height:100px;resize:vertical;border:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;padding:12px 16px;display:block}
select{padding:5px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 12px;border-radius:999px;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.outcomes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.outcomes .btn{justify-content:space-between;padding:10px 12px}
.outcomes .btn[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.panel{margin-top:12px;padding:14px 16px;border-radius:10px;background:var(--sunk)}
.panel .row{margin-bottom:12px}
.err{color:var(--red);font-size:13px;margin-top:10px}
.resfoot{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.check{width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.lines{margin:14px 0 0;padding:0;list-style:none;max-width:560px}
.lines li{padding:8px 0;border-top:1px solid var(--line)}
.props{border-left:1px solid var(--line);overflow:auto;padding:20px}
.psec+.psec{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.ph{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:12px}
.pdl{display:grid;grid-template-columns:100px 1fr;gap:10px 10px;margin:0;font-size:13.5px}
.pdl dt{color:var(--muted)}.pdl dd{margin:0}
.plink{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
/* manager */
.mgr{max-width:1000px;margin:0 auto;padding:24px 24px 120px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tile{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:16px 18px}
.tile:hover{border-color:var(--faint)}
.tile[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile.hot{background:var(--red-soft);border-color:#F2C7C1}
.tile .n{font-size:32px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile.hot .n{color:var(--red)}
.tile .t{font-weight:500;margin-top:4px}
.tile .sub{font-size:13px;color:var(--muted)}
.tile .sub.alarm{color:var(--red);font-weight:500}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.right{text-align:right;white-space:nowrap}
.caption{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 14px 6px}
.caption h3{font-size:15px;font-weight:600}
.meta{color:var(--muted);font-size:13px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.holding{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcard{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px}
.hname{font-weight:500;margin-bottom:4px}
.toggle{width:38px;height:22px;border-radius:999px;border:0;background:#D9D6D0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed=true]{background:var(--green)}.toggle[aria-pressed=true]::after{left:19px}
.agent{display:flex;gap:10px;align-items:center}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchips .chip{font-size:12px;padding:3px 10px}
.note-line{font-size:12px;margin-top:6px}
.off td{opacity:.55}
/* prototype switcher */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:4px;background:#1D1B18;border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.switcher button{border:0;background:transparent;color:#BDB7AD;padding:7px 12px;border-radius:7px;font-size:13px;white-space:nowrap}
.switcher button[aria-pressed=true]{background:#3A3732;color:#fff;box-shadow:inset 0 0 0 1px #5A564F}
.switcher button:hover{color:#fff}
.sep{width:1px;height:20px;background:#3A3732;margin:0 4px}
.demo{position:relative}
.pop{position:absolute;right:0;bottom:calc(100% + 10px);width:310px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.pop button{display:block;width:100%;text-align:left;color:var(--ink);padding:10px 12px;border-radius:8px}
.pop button:hover{background:var(--sunk);color:var(--ink)}
.pop small{display:block;color:var(--muted);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;max-width:min(560px,calc(100% - 32px));z-index:50;font-size:14px}
@media (max-width:1280px){.tasks{grid-template-columns:340px minmax(0,1fr)}.props{display:none}}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.tasks{grid-template-columns:1fr;height:auto}.qcol{max-height:50vh}.tiles{grid-template-columns:1fr}.outcomes{grid-template-columns:repeat(2,1fr)}body{overflow:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* manager v2 */
.qitem.mq{align-items:center}
.mqc{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.detail.wide{max-width:900px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;margin-top:18px}
.stats>div{padding:12px 16px;display:flex;flex-direction:column}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sh .linkbtn{margin-left:auto;font-weight:400;font-size:13px}
.chip.static{cursor:default;background:var(--sunk);border-color:transparent}
.chip:disabled{opacity:.5}
.empty-line{padding:12px 14px;border-radius:8px;background:var(--red-soft);font-size:13.5px;font-weight:500}
.seg2{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;margin-bottom:12px}
.seg2 button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.live{padding:9px 0;border-bottom:1px solid var(--line)}
.live:last-child{border-bottom:0}
.props .psec .small+.small{margin-top:4px}
.matrix th.c,.matrix td.c{text-align:center;width:86px}
.matrix th.c{white-space:normal;line-height:1.3;vertical-align:bottom}
.cb{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0}
.matrix .tag{margin-top:4px}
.totals td{background:var(--side);font-size:12.5px;font-weight:500}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.stats>div:nth-child(3){border-left:0;border-top:1px solid var(--line)}.stats>div:nth-child(4){border-top:1px solid var(--line)}}
/* v3 */
.stats{grid-template-columns:repeat(5,1fr)}
.stat{border:0;background:transparent;text-align:left;padding:12px 16px;display:flex;flex-direction:column}
.stat+.stat{border-left:1px solid var(--line)}
.stat:hover{background:#FAFAF9}
.stat[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.stat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat:first-child{border-radius:10px 0 0 10px}.stat:last-child{border-radius:0 10px 10px 0}
.vsep{width:1px;height:20px;background:var(--line);margin:0 6px}
.crumbs label select{margin-left:6px}
.touch{margin:0 0 4px;padding:8px 12px;background:var(--sunk);border-radius:8px}
.blockbox{margin-top:12px;padding:10px 14px;border-radius:8px;border:1px dashed #C9C4BB;background:#FAFAF9}
.blockbox b{font-weight:500;font-size:13.5px}
.placeholder{max-width:640px;margin:0 auto;padding:60px 24px}
.floatcard{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:45;width:320px;background:var(--red-soft);border:1px solid #F2C7C1;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.floatcard strong{color:var(--red);font-weight:600;font-size:13.5px}
.outsel{font-size:12px;padding:2px 4px;margin-top:2px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.stat+.stat{border-left:0}}
/* badges */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.5;white-space:nowrap;margin-left:auto;flex:none}
.badge.neutral{background:#EDEBE7;color:#3F3B35}
.badge.muted{background:#F4F3F1;color:#9A948A;font-weight:500}
.badge.red{background:#FCE3E0;color:#A61F14}
.badge.amber{background:#FDEFC8;color:#7A4E00}
.badge.green{background:#DDF1E5;color:#17613A}
.badge.xs{font-size:11px;padding:0 7px;min-width:0;margin-left:6px;vertical-align:1px}
.badge.lg{font-size:17px;padding:3px 12px;margin:6px 0 0;align-self:flex-start}
.qitem.mq .badge{align-self:center}
/* unified neutral selection */
.qitem.active{background:#EFEEEB;border-left-color:var(--accent)}
.qitem.active:hover{background:#EAE9E5}
.qitem.active .qn{background:var(--ink);border-color:var(--ink);color:#fff}
/* WCAG pass: text >= 4.5:1, control boundaries >= 3:1, badges separated from any background */
:root{--faint:#6F695F;--accent:#B64A08;--accent-hover:#9C3F06;--control:#8C867C}
.btn,.chip,input,textarea,select,.stepper button,.qn{border-color:var(--control)}
.btn.ghost{border-color:transparent}
.btn.primary{border-color:var(--accent)}
.chip.static{border-color:transparent;background:#E9E7E3;color:var(--ink)}
.box textarea{border-width:0 0 1px}
.nav span,.logo span{color:var(--faint)}
.badge{font-variant-numeric:normal;border:1px solid transparent}
.badge.neutral{background:#FFFFFF;border-color:#A9A399;color:#2B2824}
.badge.muted{background:#FFFFFF;border-color:#C9C4BC;color:#5F5A52}
.badge.red{background:#FCE3E0;border-color:#D9786E;color:#8E1A10}
.badge.amber{background:#FDEFC8;border-color:#C9962B;color:#5E3C00}
.badge.green{background:#DDF1E5;border-color:#6FB38B;color:#12512F}
.stat[aria-pressed=true]{background:#EFEEEB;box-shadow:inset 0 -2px 0 var(--accent)}
.stat:hover{background:#F5F4F2}
.toggle{background:#8C867C}
.qitem.active .reason.ok,.qitem.active .small{color:#524D46}
.badge.neutral{border-color:#8C867C}.badge.muted{border-color:#9E988E}.badge.red{border-color:#C24A3F}.badge.amber{border-color:#9C7212}.badge.green{border-color:#3F8C60}
.badge.muted{border-color:#8C867C}
/* call card v2 */
